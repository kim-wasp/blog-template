<h1>편집 원칙</h1><div class="prose"><ol>
<li><b>출처 우선</b>: 수치와 사실은 공식 자료나 믿을 만한 출처로 확인하고 글 끝에 출처를 남겨요. 열리지 않는 링크는 싣지 않아요.</li>
<li><b>사실과 의견 구분</b>: 사실은 출처와 함께 쓰고, 의견은 의견이라고 표시해요.</li>
<li><b>바로잡기</b>: 틀린 내용이 확인되면 고치고, 고친 날짜를 글에 남겨요.</li>
<li><b>제작 방식</b>: 자료 조사와 초안 작성에 AI 도구를 쓰고, 운영자가 사실 확인과 최종 검토를 해요. AI로 만든 이미지는 AI 이미지라고 표시해요.</li></ol></div>
